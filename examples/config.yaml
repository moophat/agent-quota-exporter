# Example configuration for agent-quota-exporter (Claude Code profiles only in this version).
# Path: --config FILE or AGENT_QUOTA_EXPORTER_CONFIG. Every key is optional except version.
version: 1
listen: "127.0.0.1:9877"        # default port 9877; set it to what your scraper expects. A port in use fails startup (exit 1).
                                # Expose beyond localhost only behind your scraper's network.
# host: node-a                  # label value; default = OS hostname
state_dir: /var/lib/agent-quota-exporter
labels: {}                      # constant labels on every series, e.g. {env: lab}
discovery:
  mode: add                     # off | add | only
  roots: ["/root", "/home/*"]   # one level: <root>/.claude and <root>/.claude-* dirs
metrics:
  max_models_per_profile: 20
  account_label: alias          # alias | email
defaults:
  usage_interval: 60s
  stale_after: 45m
profiles:
  - harness: claude-code
    alias: root
    dir: /root/.claude          # only this login owns the AgentKit status line cache
    quota:
      claude_statusline_cache: /tmp/ck-usage-limits-cache.json  # overrides exporter's CK_USAGE_CACHE_PATH, then /tmp default
      claude_oauth_usage: true  # optional fallback only when no fresh cache reading; 15 min floor stays
    # The shipped unit's PrivateTmp=true hides host /tmp. Override with PrivateTmp=false,
    # or bind the cache read-only into the service and set the path above. Prefer a
    # directory bind: atomic replacements can leave a single-file bind on an old inode.
    # Keep all other unit hardening. Cache polling uses defaults.usage_interval;
    # timestamp is the observation time; stale_after drops old readings.
  - harness: claude-code
    alias: work
    dir: /home/acct-a/.claude   # a CLAUDE_CONFIG_DIR
    account: acct-a1            # optional; default is a short hash of the account id
    quota: { claude_oauth_usage: true }   # opt-in: private, undocumented vendor endpoint
  - harness: claude-code
    alias: personal
    dir: /home/acct-b/.claude
  - harness: codex
    alias: codex-work
    dir: /home/acct-a/.codex     # a CODEX_HOME; ~/.codex is also discovered
  - harness: opencode
    alias: oc-lane-1
    dir: /var/lib/opencode-lane-1/opencode   # the data dir holding opencode.db
  - harness: 9router                  # off unless declared
    alias: router
    dir: /home/acct-a/.9router
  - harness: agy
    alias: agy-a
    dir: /home/acct-c            # the HOME agy runs under
    account: agy-a1             # required: read each agy login from one host only
    quota: { agy_usage: true }  # opt-in: runs agy's own /usage; each poll can trigger its normal token refresh
sources:
  claude-oauth-usage: { min_interval: 15m, backoff_429: 60m }   # floors; may only be raised

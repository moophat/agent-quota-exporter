# Example configuration for agent-quota-exporter (Claude Code profiles only in this version).
# Path: --config FILE or AGENT_QUOTA_EXPORTER_CONFIG. Every key is optional except version.
version: 1
# Optional lane monitoring (off by default):
# strata:
#   - name: lane-a
#     base_url: http://127.0.0.1:8080
#     interval: 30s              # default 30s, minimum 5s
listen: "127.0.0.1:9877"        # default port 9877; set it to what your scraper expects. A port in use fails startup (exit 1).
                                # Expose beyond localhost only behind your scraper's network.
# host: node-a                  # label value; default = OS hostname
state_dir: /var/lib/agent-quota-exporter
labels: {}                      # constant labels on every series, e.g. {env: lab}
# Optional private history; no source event adapters are enabled by this wiring.
events:
  enabled: false                # default; omission preserves metrics-only community mode
  root_dir: /var/lib/agent-quota-exporter/history # separate from agent state
  byte_budget: 10737418240       # example 10 GiB; REQUIRED positive operator allocation when enabled; no default
  free_space_reserve: 8388608    # default/minimum 8 MiB: bounded batch plus checkpoints
  hot_age: 2160h                # default/minimum 90 days; no automatic deletion
  privacy_profile: community    # community | parity; parity requires enabled; configured email labels allowed
  # Compatibility: identity_key_file is accepted but ignored, logging once at startup
  # when configured. No key is read or required; events use the public metric account label.
  # Enabled invalid/unwritable stores fail startup. Capacity pressure is exposed
  # via agent_event_store_{size_bytes,available_bytes,pressure}. Source write and
  # backlog gauges are absent until adapters have observed outcomes/backlog.
discovery:
  mode: add                     # off | add | only
  roots: ["/root", "/home/*"]   # one level: <root>/.claude and <root>/.claude-* dirs
metrics:
  max_models_per_profile: 20
  account_label: alias          # alias | email
  per_session: false            # opt-in: state of each live Claude session (series per session, see specs/metric-contract.md)
  max_sessions_per_profile: 50  # cap when per_session is on (1..500)
# Opt-in: which agent accounts have a job running now, from a task runner's lock files (Linux, specs/sources.md "Jobs").
# jobs:
#   lock_dir: /run/runner         # holds <codex|agy>-<account>.lock files, one flocked per running job
#   call_log: /var/log/runner/calls.jsonl   # optional: end time and exit code of the last job per account
defaults:
  usage_interval: 60s
  stale_after: 45m              # any positive duration; stale when age > max(this, 2*P + D + 15s)
  # statusline_stale_after: 5m   # legacy compatibility key; ignored (uses stale_after)
  # P = effective source poll interval; D = collection timeout (10s unless source overrides it).
profiles:
  - harness: claude-code
    alias: root
    dir: /root/.claude
    quota:
      # Off unless set: absolute path of a usage cache file that a Claude Code status line script writes
      # (format in README.md, "Claude status line cache"). Read-only; no credentials, no vendor call.
      # claude_statusline_cache: /run/claude-usage/cache.json
      claude_oauth_usage: true  # opt-in vendor call; with a cache set, it runs only while no fresh cache reading exists
    # Under the shipped systemd unit (PrivateTmp=true), a cache file in /tmp is not visible: put it
    # elsewhere, or bind its directory read-only into the service. Cache polling uses
    # defaults.usage_interval; the file's timestamp is the observation time.
  - harness: claude-code
    alias: work
    dir: /home/acct-a/.claude   # a CLAUDE_CONFIG_DIR
    account: acct-a1            # optional; default is a short hash of the account id
    quota: { claude_oauth_usage: true }   # opt-in: private, undocumented vendor endpoint
  - harness: claude-code
    alias: personal
    dir: /home/acct-b/.claude
  # - harness: opencode           # a running server: busy-session count via GET <url>/session/status
  #   alias: lane-a
  #   dir: /home/acct-a/.local/share/opencode
  #   url: http://127.0.0.1:4096  # loopback unless allow_remote: true
  - harness: codex
    alias: codex-work
    dir: /home/acct-a/.codex     # a CODEX_HOME; ~/.codex is also discovered
    quota: { codex_usage: true } # opt-in: live quota + reset slots from the ChatGPT backend; never refreshes the token
  - harness: opencode
    alias: oc-lane-1
    dir: /var/lib/opencode-lane-1/opencode   # the data dir holding opencode.db
  - harness: 9router                  # off unless declared
    alias: router
    dir: /home/acct-a/.9router
  - harness: agy
    alias: agy-a
    dir: /home/acct-c            # the HOME agy runs under
    account: agy-a1             # required: read each agy login from one host only
    quota: { agy_usage: true }  # opt-in: runs agy's own /usage; each poll can trigger its normal token refresh
  - harness: zai
    alias: zai-openclaw
    account: zai-main             # required: the `account` label, never derived from the key
    key_source: openclaw          # openclaw | opencode | zai-helper: the harness login that already holds the key
    dir: /home/acct-a/.openclaw   # that holder's directory (opencode: its data dir; zai-helper: ~/.chelper)
    quota: { zai_usage: true }    # opt-in: z.ai Coding Plan quota; the exporter never asks for a key
sources:
  claude-oauth-usage: { min_interval: 15m, backoff_429: 60m }   # floors; may only be raised
  codex-usage: { min_interval: 3m, backoff_429: 10m }           # default 3m / 10m; floors 1m / 5m
  agy-usage: { min_interval: 3m }                               # default 30m; floor 2m
  zai-usage: { min_interval: 10m, backoff_429: 30m }             # default 10m / 30m; floors 5m / 10m

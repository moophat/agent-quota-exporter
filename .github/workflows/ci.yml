# Build and test on every push and PR. The tests run as the runner's non-root user, which makes the
# read-only check in internal/app enforce (chmod 0444/0555 profile tree).
name: ci

# Bounded to keep hosted-runner minutes small: PRs and pushes to main only, superseded runs cancelled,
# a hard timeout per job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fixture secret checks (fixtures/README.md, both must print nothing)
        run: |
          if grep -rEn '@[a-z0-9-]+\.[a-z]{2,}' fixtures | grep -v example.com; then echo "email found in fixtures"; exit 1; fi
          if grep -rEn 's[k]-|e[y]J|Bea[r]er|r[e]fresh_token"\s*:\s*"[A-Za-z0-9]' fixtures; then echo "token-like value found in fixtures"; exit 1; fi

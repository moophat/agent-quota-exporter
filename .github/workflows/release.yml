# Tag-triggered release: static linux binaries + SHA256SUMS on a GitHub release.
#
# The tagged code is built and tested in a job with a read-only token and no persisted checkout credential;
# only the publish job gets contents: write, and it runs no tagged code. A final tag (vX.Y.Z) must point at a
# commit on main (reviewed and merged); an rc tag (vX.Y.Z-rc.N) may point at a PR head and is published as a
# prerelease for integration testing.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "bad tag"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: final tags must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" == *-rc.* ]] && exit 0
          # fetch-depth: 0 already brought every branch, so no authenticated fetch is needed here.
          git rev-parse --verify -q refs/remotes/origin/main >/dev/null || { echo "origin/main missing from checkout"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "final tag $TAG is not on main"; exit 1; }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            name="agent-quota-exporter_${TAG}_linux_${arch}"
            mkdir -p "out/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" -o "out/$name/agent-quota-exporter" ./cmd/agent-quota-exporter
            cp LICENSE README.md examples/config.yaml examples/agent-quota-exporter.service "out/$name/"
            tar -C out -czf "out/$name.tar.gz" "$name"
          done
          (cd out && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            out/*.tar.gz
            out/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: out
      - name: verify checksums
        run: cd out && sha256sum -c SHA256SUMS
      - name: publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""
          [[ "$TAG" == *-rc.* ]] && pre="--prerelease"
          gh release create "$TAG" out/*.tar.gz out/SHA256SUMS $pre --verify-tag --title "$TAG" \
            --notes "agent-quota-exporter $TAG (metric contract 0). Verify with: sha256sum -c SHA256SUMS"

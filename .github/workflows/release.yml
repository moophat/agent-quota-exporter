# Release: static linux binaries + SHA256SUMS on a GitHub release. Triggered by pushing a tag, by a manual
# dispatch on main with a tag name, or by pushing a branch release/<tag> (for clients that can push branches but
# neither tags nor dispatches). The last two create the tag at the triggering commit.
#
# The tagged code is built and tested in a job with a read-only token and no persisted checkout credential;
# only the publish job gets contents: write, and it runs no tagged code. A final tag (vX.Y.Z) must point at a
# commit on main (reviewed and merged); an rc tag (vX.Y.Z-rc.N) may point at a PR head and is published as a
# prerelease for integration testing.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0 or v0.1.0-rc.1 (dispatch from main only)"
        required: true
        type: string

# One run per tag at a time (GitHub keeps a single pending run per group, so a shared group would drop releases
# of other tags); different tags release independently.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}  # release/<tag> and <tag> are distinct groups; the tag check refuses the second
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: validate tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSHED: ${{ github.ref_name }}
          INPUT: ${{ inputs.tag }}
        run: |
          TAG="$PUSHED"
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$REF" == refs/heads/main ]] || { echo "dispatch releases only from main"; exit 1; }
            TAG="$INPUT"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            TAG="${REF#refs/heads/release/}"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "bad tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: final tags must be on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          [[ "$TAG" == *-rc.* ]] && exit 0
          # fetch-depth: 0 already brought every branch, so no authenticated fetch is needed here.
          git rev-parse --verify -q refs/remotes/origin/main >/dev/null || { echo "origin/main missing from checkout"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "final tag $TAG is not on main"; exit 1; }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            name="agent-quota-exporter_${TAG}_linux_${arch}"
            mkdir -p "out/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" -o "out/$name/agent-quota-exporter" ./cmd/agent-quota-exporter
            cp LICENSE README.md examples/config.yaml examples/agent-quota-exporter.service "out/$name/"
            tar -C out -czf "out/$name.tar.gz" "$name"
          done
          (cd out && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            out/*.tar.gz
            out/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: out
      - name: verify checksums
        run: cd out && sha256sum -c SHA256SUMS
      - name: publish
        env:
          TAG: ${{ needs.build.outputs.tag }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""
          [[ "$TAG" == *-rc.* ]] && pre="--prerelease"
          # Resume an interrupted publish: gh creates a draft first and publishes it last, so a draft for this tag
          # aimed at this commit is ours to finish. A published release, or a draft aimed elsewhere, is refused.
          if state=$(gh release view "$TAG" --json isDraft,targetCommitish --jq '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null); then
            read -r draft target <<<"$state"
            [[ "$draft" == true ]] || { echo "release $TAG is already published"; exit 1; }
            # The commit behind an existing tag is the proof (commits/<tag> peels annotated tags); targetCommitish can
            # name a branch. Only a dispatch draft, whose tag is created on publish, is checked by its target.
            if commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then target=$commit; fi
            [[ "$target" == "$SHA" ]] || { echo "draft $TAG is for $target, not $SHA"; exit 1; }
            gh release upload "$TAG" out/*.tar.gz out/SHA256SUMS --clobber
            gh release edit "$TAG" --draft=false $pre
            exit 0
          fi
          # A pushed tag must already exist; a dispatch or a release/<tag> branch creates it at the triggering commit
          # (and fails if it exists).
          if [[ "$EVENT" == workflow_dispatch || "$REF" == refs/heads/release/* ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "tag $TAG already exists"; exit 1
            fi
            where=(--target "$SHA")
          else
            where=(--verify-tag)
          fi
          gh release create "$TAG" out/*.tar.gz out/SHA256SUMS $pre "${where[@]}" --title "$TAG" \
            --notes "agent-quota-exporter $TAG (metric contract 0). Verify with: sha256sum -c SHA256SUMS"
